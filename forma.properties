spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
##eureaka server configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

#needed for common-ai-agent service
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

#local LLM configuration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5-coder:1.5b
spring.ai.ollama.embedding.model=nomic-embed-text:v1.5

#eureaka server configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG



spring.datasource.url=jdbc:postgresql://localhost:5435/forma_db
spring.datasource.username=forma_user
spring.datasource.password=forma_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update


# Set the maximum size allowed for a single uploaded file
spring.servlet.multipart.max-file-size=10MB

# Set the maximum size allowed for total multipart/form-data requests
spring.servlet.multipart.max-request-size=10MB

# Prevent embedded Tomcat from cutting off the connection prematurely
server.tomcat.max-swallow-size=-1
